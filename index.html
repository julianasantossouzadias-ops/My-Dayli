<title>My Daily</title>
<style>
body{margin:0;font-family:Arial;background:#fff;color:#222}
header{padding:14px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee}
.foto{width:54px;height:54px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #2563eb;font-size:11px;text-align:center;cursor:pointer}
.foto img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:22px}
.sub{margin:0;color:#666;font-size:13px}
nav{display:flex;gap:8px;overflow:auto;padding:12px}
nav button{background:#2563eb;color:#fff;border:1px solid #2563eb;padding:10px 14px;border-radius:999px;white-space:nowrap}
nav button.ativo{background:#fff;color:#2563eb}
main{padding:0 14px 80px;max-width:700px;margin:auto}
.card{background:#f8fafc;border:1px solid #eee;border-radius:14px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:15px;box-sizing:border-box}
.btn{background:#2563eb;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold}
.btn2{background:#fff;border:1px solid #2563eb;color:#2563eb;padding:8px 12px;border-radius:999px;margin:4px 4px 4px 0}
.dias button{padding:9px 12px;border-radius:999px;border:1px solid #ddd;background:#fff;margin:3px}
.dias button.ativo{background:#2563eb;color:#fff}
.item{display:flex;gap:8px;align-items:center;background:#fff;padding:10px;border-radius:10px;border:1px solid #eee;margin:6px 0}
.feito{opacity:.6;text-decoration:line-through}
.escondido{display:none}
.foto-momento{width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
